name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Guard: No __pycache__ in repo ────────────────────────
      - name: Check for committed __pycache__
        run: |
          if find . -type d -name "__pycache__" | grep -q .; then
            echo "::error::Committed __pycache__ detected! Remove before push."
            find . -type d -name "__pycache__"
            exit 1
          fi

      # ── Python Setup ─────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # ── Install Dependencies ─────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy pytest pytest-cov bandit

      # ── Lint (Ruff) ──────────────────────────────────────────
      - name: Lint with Ruff
        run: ruff check .

      # ── Format Check (Black) ─────────────────────────────────
      - name: Check formatting with Black
        run: black --check .

      # ── Type Check (mypy) ────────────────────────────────────
      # '|| true' allows the build to pass while you gradually add types
      - name: Type check with mypy
        run: mypy grandprix/ tests/ || true

      # ── Security Scan (Bandit) ───────────────────────────────
      - name: Security scan with Bandit
        run: bandit -r grandprix/ -ll || true

      # ── Syntax Check All Python Files ────────────────────────
      - name: Syntax check all modules
        run: |
          find . -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} +

      # ── Run Tests ────────────────────────────────────────────
      - name: Test with pytest
        run: pytest -q --cov=grandprix --cov-report=xml --cov-report=term

      # ── Upload Coverage (only once) ──────────────────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
